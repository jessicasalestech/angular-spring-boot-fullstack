# ---------------------------------------------------------------------------
# Task API configuration
# ---------------------------------------------------------------------------
spring.application.name=task-api
server.port=8081

# H2 in-memory database (recreated on every start)
spring.datasource.url=jdbc:h2:mem:tasks;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true

# H2 web console: http://localhost:8081/h2-console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Origins allowed to call /api/** (comma separated)
app.cors.allowed-origins=http://localhost:4200

# Seed data so the UI is not empty on first run
app.seed-data=true

# Human-readable errors in logs
server.error.include-message=always
